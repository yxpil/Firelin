[package]
name = "firelin"
version = "0.2.0"
edition = "2021"
description = "Agent-oriented network penetration testing toolkit around the BIT ecosystem: TCP port scan, DNS subdomain enumeration, directory enumeration, HTTP fingerprint (authorized use only)"
license = "Apache-2.0"
repository = "https://github.com/yxpil/Firelin"
keywords = ["ai", "agent", "security", "bit", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "firelin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
